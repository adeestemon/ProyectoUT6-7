<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan De Los Muertos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body><img src="img/logo_juandelosmuertos.png" alt="Logo" id="main-logo" class="logo-animado">

    <header id="main-header">
        <div class="logo-placeholder"></div>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#servicios">Servicios</a></li>
                <li><a href="#solicitar-servicio">Contratanos</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <div class="logo-gap"></div>
                <h1>JUAN DE LOS MUERTOS</h1>
                <h2>Matamos a sus seres queridos</h2>
                <a href="#solicitar-servicio" class="btn-urgencia">Solicitar servicio</a>
            </div>
            <div class="hero-image-container">
                <img src="img/juan_portada.jpg" alt="Juan de los Muertos" class="hero-image">
            </div>
        </div>
    </section>




    <section class="services-section" id="servicios">
        <h2 class="section-title">Nuestros Servicios</h2>
        <div id="services-container" class="services-grid"></div>
    </section>

    <section class="contact-section">
        <h2 class="section-title" id="solicitar-servicio">Solicitar Servicio</h2>
        <form id="form-encargo" class="contact-form">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ej; Pepe">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" placeholder="Ej; Garcia" required>
            </div>

            <div class="form-group">
                <label>Teléfono (9 dígitos)</label>
                <input type="tel" id="telefono" maxlength="9" pattern="[0-9]{9}" required>
            </div>

            <div class="form-group">
                <label>TIPO DE URGENCIA (SELECCIÓN ÚNICA):</label>

                <div class="radio-option">
                    <input type="radio" id="urgencia-baja" name="urgencia" value="baja" checked>
                    <label for="urgencia-baja">SOCIAL (POCO RIESGO)</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="urgencia-alta" name="urgencia" value="alta">
                    <label for="urgencia-alta">CRÍTICA (ME ESTÁN COMIENDO)</label>
                </div>
            </div>

            <div class="form-group">
                <label>Extras:</label><br>
                <input type="checkbox" id="extra-incineracion" name="extra" value="incineracion">
                <label for="extra-incineracion">Incineración</label><br>
                <input type="checkbox" id="extra-limpieza" name="extra" value="limpieza">
                <label for="extra-limpieza">Limpieza de sangre</label><br>
                <input type="checkbox" id="extra-silencio" name="extra" value="silencio">
                <label for="extra-silencio">Discreción absoluta</label>
            </div>

            <div class="form-group">
                <label>Sube foto del "disidente":</label>
                <input type="file" id="foto" accept="image/*">
            </div>

            <div class="form-group">
                <label>Descripción de la situación</label>
                <textarea id="descripcion" rows="4"></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Encargo</button>
        </form>
    </section>

    <section class="orders-section">
        <h2 class="section-title">Encargos en Curso</h2>
        <div id="lista-encargos"></div>
    </section>




    <section class="video-section">
        <h2 class="section-title">Protocolo de Seguridad</h2>
        <div id="video-container" class="custom-player"></div>
    </section>
    <script src="js/animacion.js"></script>
    <script src="js/video.js"></script>
    <script src="js/form.js"></script>

</body>

</html>
